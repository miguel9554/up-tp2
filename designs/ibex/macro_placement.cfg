# Placement of the SRAM macros (read by LibreLane through MACRO_PLACEMENT_CFG).
#
# One line per macro:   <instance> <x> <y> <orientation>
#   x, y         lower-left corner of the macro's bounding box, in µm, measured
#                from the lower-left corner of the die
#   orientation  N, S, FN or FS (DEF orientations, see TP.md)
# Everything after a '#' is a comment.
#
# make floorplan / make place check this file first (scripts/check_macros.py):
# every macro placed, inside the core and without overlaps.
# These locations assume a die of at least ~1625 µm per side.

